  "@payloadcms/db-postgres": "4.0.0-beta.10"
  "@payloadcms/next": "4.0.0-beta.10"
  "@payloadcms/plugin-nested-docs": "4.0.0-beta.10"
  "@payloadcms/richtext-lexical": "4.0.0-beta.10"
  "@payloadcms/sdk": "4.0.0-beta.10"
  "@payloadcms/transformer-sharp": "4.0.0-beta.10"
  "@payloadcms/translations": "4.0.0-beta.10"
  "@payloadcms/ui": "4.0.0-beta.10"
  "ajv": "^8.18.0"
  "devalue": "^5.6.4"
  "diff": "^8.0.3"
  "esbuild": "^0.25.0"
  "file-type": "^21.3.2"
  "h3": "^1.15.5"
  "lodash": "^4.17.23"
  "next": "16.4.6"
  "payload": "4.0.0-beta.10"
  "react": "19.3.1"
  "react-dom": "19.3.1"
  "rollup": "^4.59.0"
  "smol-toml": "^1.6.1"
  "anymatch>picomatch": "^2.3.2"
  "micromatch>picomatch": "^4.0.4"
  "readdirp>picomatch": "^2.3.2"
  "tinyglobby>picomatch": "^4.0.4"
  "vitest>picomatch": "^4.0.4"
  "svgo": "^4.0.1"
  "undici": "^7.18.2"
  "yaml": "^2.8.3"

allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - payload
  - "@payloadcms/*"

publishBranch: main

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - pino@9.14.0
  - vite@5.4.21
  - vite@6.4.1
